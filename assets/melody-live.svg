<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" role="img" aria-labelledby="title desc">
  <title id="title">Melody Music live playback animation</title>
  <desc id="desc">Animated neon equalizer bars showing live music playback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160b1d"/>
      <stop offset="0.5" stop-color="#26102f"/>
      <stop offset="1" stop-color="#0d1728"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d8d"/>
      <stop offset="0.48" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#62e6d8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="758" height="148" rx="22" fill="url(#bg)" stroke="#ff4d8d" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="66" cy="75" r="32" fill="#ff4d8d" fill-opacity=".12" stroke="#ff4d8d" stroke-opacity=".8"/>
  <path d="M59 60v30l22-15z" fill="#fff" filter="url(#glow)"/>
  <text x="120" y="66" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="4">MELODY MUSIC</text>
  <text x="120" y="94" fill="#ffb8d2" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">LIVE VOICE-CHAT PLAYBACK</text>
  <g transform="translate(510 34)" fill="url(#bars)" filter="url(#glow)">
    <rect x="0" y="45" width="8" height="30" rx="4"><animate attributeName="height" values="30;62;22;48;30" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="45;13;53;27;45" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="18" y="28" width="8" height="64" rx="4"><animate attributeName="height" values="64;26;78;42;64" dur="1.1s" begin=".1s" repeatCount="indefinite"/><animate attributeName="y" values="28;47;14;32;28" dur="1.1s" begin=".1s" repeatCount="indefinite"/></rect>
    <rect x="36" y="12" width="8" height="92" rx="4"><animate attributeName="height" values="92;38;70;18;92" dur="1.5s" begin=".2s" repeatCount="indefinite"/><animate attributeName="y" values="12;39;23;54;12" dur="1.5s" begin=".2s" repeatCount="indefinite"/></rect>
    <rect x="54" y="35" width="8" height="48" rx="4"><animate attributeName="height" values="48;82;30;58;48" dur="1.2s" begin=".3s" repeatCount="indefinite"/><animate attributeName="y" values="35;18;44;30;35" dur="1.2s" begin=".3s" repeatCount="indefinite"/></rect>
    <rect x="72" y="20" width="8" height="78" rx="4"><animate attributeName="height" values="78;28;88;44;78" dur="1.4s" begin=".4s" repeatCount="indefinite"/><animate attributeName="y" values="20;45;8;30;20" dur="1.4s" begin=".4s" repeatCount="indefinite"/></rect>
    <rect x="90" y="46" width="8" height="28" rx="4"><animate attributeName="height" values="28;68;20;52;28" dur="1.0s" begin=".5s" repeatCount="indefinite"/><animate attributeName="y" values="46;26;50;34;46" dur="1.0s" begin=".5s" repeatCount="indefinite"/></rect>
    <rect x="108" y="30" width="8" height="60" rx="4"><animate attributeName="height" values="60;34;84;26;60" dur="1.25s" begin=".6s" repeatCount="indefinite"/><animate attributeName="y" values="30;43;10;47;30" dur="1.25s" begin=".6s" repeatCount="indefinite"/></rect>
    <rect x="126" y="15" width="8" height="88" rx="4"><animate attributeName="height" values="88;45;24;74;88" dur="1.35s" begin=".7s" repeatCount="indefinite"/><animate attributeName="y" values="15;37;50;22;15" dur="1.35s" begin=".7s" repeatCount="indefinite"/></rect>
    <rect x="144" y="40" width="8" height="40" rx="4"><animate attributeName="height" values="40;76;24;56;40" dur="1.15s" begin=".8s" repeatCount="indefinite"/><animate attributeName="y" values="40;22;48;32;40" dur="1.15s" begin=".8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
