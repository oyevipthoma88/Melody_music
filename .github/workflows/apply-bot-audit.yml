name: Apply verified bot audit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - name: Apply tested fixes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PYCODE'
          import ast,base64,json,os,pathlib,subprocess,urllib.request,zlib
          encoded = ''''''
          patch=zlib.decompress(base64.b64decode(encoded))
          subprocess.run(['patch','-p1','--batch','--forward'],input=patch,check=True)
          subprocess.run(['python','-m','pytest','tests/test_audit_runtime_regressions.py','-q'],check=True)
          for folder in ('melody','utils'):
              for p in pathlib.Path(folder).rglob('*.py'):
                  ast.parse(p.read_text(),filename=str(p),feature_version=(3,10))
          def api(path,body=None,method=None):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GH_REPO']+'/'+path,data=json.dumps(body).encode() if body is not None else None,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r:return json.load(r)
          ref=api('git/ref/heads/main')['object']['sha']
          if ref != os.environ.get('GITHUB_SHA'):raise RuntimeError('Main changed; refusing overwrite')
          tree=api('git/commits/'+ref)['tree']['sha']
          paths=['melody/config.py','utils/cmd_lock.py','utils/decorators.py','utils/database.py','melody/plugins/misc/chatbot.py','melody/__main__.py','app.json','melody/core/call.py','melody/core/ytdl.py','tests/test_audit_runtime_regressions.py']
          entries=[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in paths]
          entries.append({'path':'.github/workflows/apply-bot-audit.yml','mode':'100644','type':'blob','sha':None})
          entries.append({'path':'AGENTS.md','mode':'100644','type':'blob','content':'# Bot maintenance rules\n- Stream replacements share per-chat commit locks and generation fences.\n- Speed is a stream-builder input and commits only after successful replacement.\n- Shared downloads track consumer owners and promote interactive waiters; reclaim only granted slots.\n- Cache missing settings with a sentinel and report failed persistent writes.\n'})
          newtree=api('git/trees',{'base_tree':tree,'tree':entries})['sha']
          commit=api('git/commits',{'message':'Fix reactions default, command locking, seek races, pause clock and shared downloads; add runtime tests','tree':newtree,'parents':[ref]})['sha']
          api('git/refs/heads/main',{'sha':commit,'force':False},'PATCH')
          print('Verified fixes committed:',commit)
          PYCODE
